name: Appium Mobile Automation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  usb-appium-validation:
    name: USB/Appium Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_DEVICE_UDID: ${{ secrets.ANDROID_DEVICE_UDID }}
      IOS_DEVICE_UDID: ${{ secrets.IOS_DEVICE_UDID }}
      ANDROID_APP_PATH: ${{ secrets.ANDROID_APP_PATH }}
      IOS_APP_PATH: ${{ secrets.IOS_APP_PATH }}

      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      INVALID_EMAIL: ${{ secrets.INVALID_EMAIL }}
      INCORRECT_PASSWORD: ${{ secrets.INCORRECT_PASSWORD }}

      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required variables
        shell: bash
        run: |
          required_variables=(
            ANDROID_DEVICE_UDID
            IOS_DEVICE_UDID
            ANDROID_APP_PATH
            IOS_APP_PATH
            TEST_USER_EMAIL
            TEST_USER_PASSWORD
            INVALID_EMAIL
            INCORRECT_PASSWORD
          )

          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is missing or empty"
              exit 1
            fi
          done

          echo "All required variables are available."

      - name: Clean previous Allure results
        shell: bash
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf reports/allure-report
          rm -rf _site
          mkdir -p allure-results

      - name: Run TypeScript validation
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Prepare Allure site
        if: always()
        shell: bash
        run: |
          echo "Searching for generated Allure report..."

          rm -rf _site
          mkdir -p _site

          if [[ -f "allure-report/index.html" ]]; then
            echo "Report found at allure-report"
            cp -R allure-report/. _site/
          elif [[ -f "reports/allure-report/index.html" ]]; then
            echo "Report found at reports/allure-report"
            cp -R reports/allure-report/. _site/
          else
            echo "::error::Allure index.html was not found."
            echo "Available index.html files:"
            find . -maxdepth 4 -type f -name "index.html" -print
            exit 1
          fi

          echo "Files prepared for GitHub Pages:"
          find _site -maxdepth 2 -type f | head -30

          test -f "_site/index.html"

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload downloadable Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-allure-report-${{ github.run_number }}
          path: |
            allure-results
            _site
          if-no-files-found: warn
          retention-days: 14

      - name: Set final workflow result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.typecheck.outcome }}" == "failure" ]]; then
            echo "TypeScript validation failed."
            exit 1
          fi

          echo "TypeScript validation passed."

  deploy-allure-report:
    name: Publish Allure Report
    if: always()
    needs: android-smoke-test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4