name: Appium Mobile Automation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  android-smoke-test:
    name: Android BrowserStack Validation
    runs-on: ubuntu-latest

    env:
      # Tus secrets...

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required variables
        # Tu validación actual...

      - name: Clean previous Allure results
        run: |
          rm -rf allure-results
          rm -rf allure-report
          mkdir -p allure-results

      - name: Run Android successful login test
        id: android-test
        continue-on-error: true
        run: >
          npx wdio run
          "./config/wdio.android.browserstack.conf.ts"
          --spec
          "./test/features/authentication/successful-login.feature"

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Set final workflow result
        if: always()
        run: |
          if [[ "${{ steps.android-test.outcome }}" == "failure" ]]; then
            exit 1
          fi

  deploy-allure-report:
    name: Publish Allure Report
    if: always()
    needs: android-smoke-test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4